<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoidVisuals // C++ Engine & Snippets</title>
  
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body {
      background: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #38bdf8;
    }

    .brand span { color: #94a3b8; font-weight: 400; font-size: 0.9rem; }

    .header-btns {
      display: flex;
      gap: 12px;
    }

    .btn-primary {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #0369a1; }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* Search & Filter Bar */
    .filter-section {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 30px;
      align-items: center;
      justify-content: space-between;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      outline: none;
      font-size: 0.9rem;
    }
    .search-input:focus { border-color: #38bdf8; }

    /* Snippet Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 22px;
    }

    .code-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .code-card:hover {
      transform: translateY(-3px);
      border-color: #38bdf8;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .card-tag {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.4;
      flex-grow: 1;
    }

    pre {
      background: #050811;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.78rem;
      color: #cbd5e1;
      overflow-x: auto;
      max-height: 180px;
      margin-bottom: 16px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
    }

    .card-actions button {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      transition: all 0.2s;
    }
    .card-actions button:hover { background: #334155; }
    .card-actions .btn-run {
      background: #0284c7;
      border-color: #0284c7;
    }
    .card-actions .btn-run:hover { background: #0369a1; }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 18px;
      width: 100%;
      max-width: 580px;
      padding: 24px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-close {
      background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer;
    }

    /* Admin Form Fields */
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block; font-size: 0.75rem; font-weight: 700; color: #94a3b8; margin-bottom: 4px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: #050811;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      outline: none;
    }
    .form-group textarea { height: 120px; font-family: monospace; }

    /* Terminal Styling */
    .terminal-window {
      background: #050811;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #10b981;
      min-height: 180px;
      white-space: pre-wrap;
      overflow-y: auto;
    }

    /* Toast */
    #vvToast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10000;
      background: #0284c7;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      &lt;/VoidVisuals&gt;
      <span>Engine v2.4</span>
    </div>
    <div class="header-btns">
      <button class="btn-primary" onclick="openAdminModal()">+ Add Snippet (Admin)</button>
    </div>
  </header>

  <!-- Main Showcase -->
  <main>
    <div class="filter-section">
      <input type="text" id="snippetSearch" class="search-input" placeholder="Search C++ algorithms, STL, keywords..." oninput="filterCards()">
    </div>

    <!-- Cards Container -->
    <div id="snippetsContainer" class="cards-grid">
      <p style="color:#64748b;">Loading snippets database...</p>
    </div>
  </main>

  <!-- Live Sandbox Terminal Modal -->
  <div id="sandboxModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="sandboxTitle" style="color: #38bdf8;">⚡ Live Sandbox Preview</h3>
        <button class="modal-close" onclick="closeSandboxModal()">&times;</button>
      </div>
      <div id="terminalScreen" class="terminal-window">
        [Compiling & Executing C++ Engine...]
      </div>
    </div>
  </div>

  <!-- Admin Modal (Instant JSON Export) -->
  <div id="adminModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Add Snippet to VoidVisuals</h3>
        <button class="modal-close" onclick="closeAdminModal()">&times;</button>
      </div>
      <form id="adminForm" onsubmit="handleAdminSubmit(event)">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="snippetTitle" placeholder="e.g. Radix Sort Implementation" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="snippetCategory">
            <option value="Algorithms">Algorithms</option>
            <option value="STL">Standard Template Library (STL)</option>
            <option value="Data Structures">Data Structures</option>
            <option value="OOP">OOP</option>
            <option value="Modern C++">Modern C++</option>
            <option value="Core">Core Fundamentals</option>
            <option value="Memory Management">Memory Management</option>
          </select>
        </div>
        <div class="form-group">
          <label>Short Description</label>
          <input type="text" id="snippetDesc" placeholder="Brief technical explanation of logic..." required>
        </div>
        <div class="form-group">
          <label>C++ Source Code</label>
          <textarea id="snippetCode" placeholder="#include <iostream>..." required></textarea>
        </div>
        <div class="form-group">
          <label>Expected Console Output</label>
          <input type="text" id="snippetOutput" placeholder="e.g. Process finished with exit code 0.">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Copy JSON & Add to GitHub</button>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="vvToast">Copied to clipboard!</div>

  <script>
    let globalSnippets = [];

    // 1. Fetch snippets.json and render cards
    async function loadSnippets() {
      const container = document.getElementById('snippetsContainer');
      try {
        const res = await fetch('snippets.json?t=' + Date.now());
        if (!res.ok) throw new Error("Could not find snippets.json");
        globalSnippets = await res.json();
        renderCards(globalSnippets);
      } catch (err) {
        container.innerHTML = `<p style="color:#ef4444;">Failed to load snippets: ${err.message}</p>`;
      }
    }

    function renderCards(list) {
      const container = document.getElementById('snippetsContainer');
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `<p style="color:#64748b;">No matching C++ snippets found.</p>`;
        return;
      }

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'code-card';
        card.dataset.title = item.title.toLowerCase();
        card.dataset.desc = item.desc.toLowerCase();
        card.dataset.category = item.category.toLowerCase();

        card.innerHTML = `
          <div>
            <div class="card-meta">
              <span class="card-tag">${item.category}</span>
            </div>
            <h4 class="card-title">${item.title}</h4>
            <p class="card-desc">${item.desc}</p>
            <pre><code>${escapeHtml(item.code)}</code></pre>
          </div>
          <div class="card-actions">
            <button onclick="copySnippetCode('${item.id}')">Copy</button>
            <button class="btn-run" onclick="runSandbox('${item.id}')">Run Engine ⚡</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 2. Filter Search
    function filterCards() {
      const q = document.getElementById('snippetSearch').value.toLowerCase().trim();
      const filtered = globalSnippets.filter(item => 
        item.title.toLowerCase().includes(q) ||
        item.desc.toLowerCase().includes(q) ||
        item.category.toLowerCase().includes(q)
      );
      renderCards(filtered);
    }

    // 3. Copy Code
    function copySnippetCode(id) {
      const item = globalSnippets.find(x => x.id === id);
      if (!item) return;
      navigator.clipboard.writeText(item.code).then(() => {
        showToast("✓ C++ Code Copied!");
      });
    }

    // 4. Run Sandbox Simulation
    function runSandbox(id) {
      const item = globalSnippets.find(x => x.id === id);
      if (!item) return;

      const modal = document.getElementById('sandboxModal');
      const terminal = document.getElementById('terminalScreen');
      const titleElem = document.getElementById('sandboxTitle');

      titleElem.innerText = `⚡ Sandbox: ${item.title}`;
      terminal.innerText = "[Compiling via <VoidSpark92> GCC Engine...]\n\n";
      modal.style.display = 'flex';

      setTimeout(() => {
        terminal.innerText += (item.output || "Program executed successfully.\nProcess finished with exit code 0.");
      }, 350);
    }

    function closeSandboxModal() {
      document.getElementById('sandboxModal').style.display = 'none';
    }

    // 5. Admin Form Submission (Auto-Copy JSON)
    function openAdminModal() {
      document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminModal() {
      document.getElementById('adminModal').style.display = 'none';
    }

    function handleAdminSubmit(e) {
      e.preventDefault();
      
      const newObj = {
        id: "CPP_" + Date.now(),
        title: document.getElementById('snippetTitle').value.trim(),
        category: document.getElementById('snippetCategory').value,
        desc: document.getElementById('snippetDesc').value.trim(),
        code: document.getElementById('snippetCode').value,
        output: document.getElementById('snippetOutput').value.trim() || "Process finished with exit code 0."
      };

      const jsonString = JSON.stringify(newObj, null, 2) + ",";

      navigator.clipboard.writeText(jsonString).then(() => {
        alert("✓ JSON Format Automatically Copied to Clipboard!\n\nAb GitHub repo me jaakar 'snippets.json' me paste karke Commit kar dein.");
        document.getElementById('adminForm').reset();
        closeAdminModal();
      }).catch(() => {
        prompt("Copy this snippet text and paste into snippets.json:", jsonString);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('vvToast');
      toast.innerText = msg;
      toast.style.opacity = '1';
      toast.style.transform = 'translateY(0)';
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
      }, 2000);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.addEventListener('DOMContentLoaded', loadSnippets);
  </script>
</body>
</html>
